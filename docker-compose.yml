version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: iris_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris_dev_password
      POSTGRES_DB: iris_db
    ports:
      - "5432:5432"
    volumes:
      - iris_pgdata:/var/lib/postgresql/data
volumes:
  iris_pgdata:
